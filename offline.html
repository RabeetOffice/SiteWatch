<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>Offline · SiteWatch</title>
    <link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml">
    <style>
        :root { color-scheme: light dark; }
        body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #F6F7F9; color: #111827; }
        .box { max-width: 380px; text-align: center; }
        img { width: 56px; height: 56px; }
        h1 { font-size: 18px; margin: 16px 0 6px; }
        p { margin: 0 0 20px; font-size: 14px; color: #64748B; line-height: 1.5; }
        button { font: inherit; font-size: 14px; font-weight: 600; padding: 9px 16px; border-radius: 8px; border: 1px solid #C2410C; background: #C2410C; color: #fff; cursor: pointer; }
        @media (prefers-color-scheme: dark) {
            body { background: #0F1113; color: #F3F4F6; }
            p { color: #A8B0BA; }
        }
    </style>
</head>
<body>
    <div class="box">
        <img src="assets/images/favicon.svg" alt="">
        <h1>You're offline</h1>
        <p>SiteWatch needs a connection to show current monitoring data. Your websites are still being checked on the server.</p>
        <button type="button" onclick="location.reload()">Try again</button>
    </div>
</body>
</html>
